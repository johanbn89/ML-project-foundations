[project]
name = "ml-project-foundations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
   "hydra-core>=1.3.2",
   "lightning==2.1.3",
   "mlflow>=3.8.1",
   "numpy>=2.4.1",
   "torch>=2.10.0",
   "torchaudio>=2.10.0",
   "torchvision>=0.25.0",
   "typer>=0.21.1",
   "ml-project-foundations-data-quarry",
   "langchain-core>=1.2.19",
   "langchain-community>=0.4.1",
   "langchain-ollama>=1.0.1",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.11",
    "pre-commit>=4.5.1",
    "ipython>=9.9.0",
]

# TODO: Make a note in readme about location of clone of data quarry repo
[tool.uv.sources]
ml-project-foundations-data-quarry = { path = "../ML-project-foundations-data-quarry" }


[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
# If a dependency doesn’t ship type hints, don’t fail my build because of it
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
cache_dir = ".mypy_cache"
incremental = true


[tool.ruff]
line-length = 120
target-version = "py312"
fix = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort (import sorting)
]
ignore = [
    "E501",  # line length (handled by black)
    "E402",
]

[tool.ruff.lint.isort]
known-first-party = ["ml_project_foundations"]

[tool.black]
line-length = 120
target-version = ["py312"]

