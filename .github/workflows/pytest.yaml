name: Run tests with pytest

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Check out code
      - name: Check out code
        uses: actions/checkout@v4

      # 2️⃣ Set up uv (with caching enabled)
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # 3️⃣ Install Python and dependencies
      - name: Install dependencies
        run: |
          uv sync

      # 4️⃣ Run pytest
      - name: Run tests
        run: |
          uv run pytest -v
