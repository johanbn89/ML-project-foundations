name: Run tests with pytest

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Check out code
      - name: Check out code
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Install uv
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # 4️⃣ Cache uv downloads
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py311-

      # 5️⃣ Install dependencies
      - name: Install dependencies
        run: |
          uv sync

      # 6️⃣ Run pytest
      - name: Run tests
        run: |
          uv run pytest -v
