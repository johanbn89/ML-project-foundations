name: Run tests with pytest

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Check out code
      - name: Check out code
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Install uv
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      # 4️⃣ Install dependencies (fast + cached)
      - name: Install dependencies
        run: |
          uv sync

      # 5️⃣ Run pytest via uv
      - name: Run tests
        run: |
          uv run pytest -v
